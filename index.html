<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rodea la Palabra - Juego Educativo PWA</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Fredoka for child-friendly typography -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22Rodea%20la%20Palabra%22%2C%22short_name%22%3A%22RodeaPalabra%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23fef3c7%22%2C%22theme_color%22%3A%22%23f59e0b%22%7D">
    <style>
        body {
            font-family: 'Fredoka', sans-serif;
            touch-action: manipulation;
        }
        /* Custom circle animation and styling */
        .circled-word {
            position: relative;
        }
        .circled-word::after {
            content: '';
            position: absolute;
            top: -6px;
            left: -10px;
            right: -10px;
            bottom: -6px;
            border: 4px solid #ef4444;
            border-radius: 50% / 60%;
            pointer-events: none;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .shake {
            animation: shakeAnim 0.4s ease-in-out;
        }
        @keyframes shakeAnim {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }
    </style>
</head>
<body class="bg-amber-50 min-h-screen flex flex-col items-center justify-between p-4 transition-colors duration-500" id="body-bg">

    <!-- Top Navigation / Letter Selector Header -->
    <header class="w-full max-w-5xl bg-white/80 backdrop-blur-md shadow-lg rounded-3xl p-4 mb-4 flex flex-col md:flex-row items-center justify-between border-4 border-amber-200">
        <div class="flex items-center space-x-3 mb-3 md:mb-0">
            <span class="text-3xl">🎈</span>
            <h1 class="text-2xl md:text-3xl font-bold text-amber-700 tracking-wide">Aprende Letras PWA</h1>
        </div>
        <!-- Letter Selector Buttons -->
        <div class="flex flex-wrap gap-2 justify-center">
            <button onclick="switchLetter('M')" id="btn-M" class="px-4 py-2 rounded-2xl font-bold text-lg shadow-md transition-all transform hover:scale-105 active:scale-95 bg-amber-400 text-white border-b-4 border-amber-600">Letra M</button>
            <button onclick="switchLetter('S')" id="btn-S" class="px-4 py-2 rounded-2xl font-bold text-lg shadow-md transition-all transform hover:scale-105 active:scale-95 bg-stone-100 text-stone-600 border-b-4 border-stone-300">Letra S</button>
            <button onclick="switchLetter('T')" id="btn-T" class="px-4 py-2 rounded-2xl font-bold text-lg shadow-md transition-all transform hover:scale-105 active:scale-95 bg-stone-100 text-stone-600 border-b-4 border-stone-300">Letra T</button>
            <button onclick="switchLetter('P')" id="btn-P" class="px-4 py-2 rounded-2xl font-bold text-lg shadow-md transition-all transform hover:scale-105 active:scale-95 bg-stone-100 text-stone-600 border-b-4 border-stone-300">Letra P</button>
        </div>
    </header>

    <!-- Main Instruction & Target Display Card -->
    <main class="w-full max-w-5xl flex-1 flex flex-col items-center justify-center bg-white/90 shadow-xl rounded-3xl p-6 md:p-8 border-4 border-amber-200 mb-4 relative overflow-hidden">
        
        <!-- Instruction banner -->
        <div class="text-center mb-6">
            <div id="instruction-text" class="text-xl md:text-3xl font-bold text-amber-800 uppercase tracking-wide mb-3 bg-amber-100 py-3 px-6 rounded-2xl shadow-inner inline-block border-2 border-amber-300">
                ¡Rodea la palabra que contenga la letra M!
            </div>
            <!-- Big Letter Display Target -->
            <div class="flex items-center justify-center space-x-4 mt-2">
                <div id="target-letter-box" class="w-24 h-24 md:w-28 md:h-28 rounded-full bg-amber-300 border-4 border-red-500 flex items-center justify-center shadow-lg mx-auto">
                    <span id="target-letter" class="text-6xl md:text-7xl font-bold text-stone-900">m</span>
                </div>
                <button onclick="speakInstruction()" class="bg-amber-500 hover:bg-amber-600 text-white p-3 rounded-full shadow-md transition transform hover:scale-110 active:scale-95" title="Escuchar instrucción">
                    🔊
                </button>
            </div>
        </div>

        <!-- Progress counter & Reset status -->
        <div class="w-full flex justify-between items-center mb-4 px-2 text-stone-600 font-semibold text-lg">
            <span id="progress-status">Encontradas: 0 / 15</span>
            <button onclick="resetCurrentGame()" class="bg-rose-100 hover:bg-rose-200 text-rose-700 px-4 py-1.5 rounded-xl text-sm font-bold border border-rose-300 shadow-sm transition">🔄 Reiniciar actividad</button>
        </div>

        <!-- Word Grid Container -->
        <div id="word-grid" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 gap-3 md:gap-4 w-full my-2">
            <!-- Dynamically populated words -->
        </div>

        <!-- Success or error notification overlay/message -->
        <div id="feedback-toast" class="hidden absolute bottom-4 px-6 py-3 rounded-2xl text-white font-bold text-lg shadow-2xl transition-all transform translate-y-10">
            ¡Excelente! Sigue así 🌟
        </div>
    </main>

    <!-- Footer / Credits -->
    <footer class="text-center text-stone-500 text-sm font-medium">
        Aplicación Educativa Interactiva PWA • Hecho con cariño para niños 🍎
    </footer>

    <!-- JavaScript Game Logic -->
    <script>
        // Game Data structure with 15 correct words per activity and distractors
        const gameData = {
            'M': {
                letter: 'm',
                bg: 'bg-amber-50',
                headerBg: 'bg-amber-300',
                nextLetter: 'S',
                words: [
                    // 15 Correct words containing 'm'
                    { text: 'coma', hasLetter: true },
                    { text: 'mes', hasLetter: true },
                    { text: 'eme', hasLetter: true },
                    { text: 'madre', hasLetter: true },
                    { text: 'mano', hasLetter: true },
                    { text: 'míos', hasLetter: true },
                    { text: 'misa', hasLetter: true },
                    { text: 'mata', hasLetter: true },
                    { text: 'maíz', hasLetter: true },
                    { text: 'me', hasLetter: true },
                    { text: 'mil', hasLetter: true },
                    { text: 'más', hasLetter: true },
                    { text: 'mal', hasLetter: true },
                    { text: 'meseta', hasLetter: true },
                    { text: 'cama', hasLetter: true },
                    // 9 Distractors without 'm'
                    { text: 'unos', hasLetter: false },
                    { text: 'ala', hasLetter: false },
                    { text: 'techos', hasLetter: false },
                    { text: 'risa', hasLetter: false },
                    { text: 'cose', hasLetter: false },
                    { text: 'pone', hasLetter: false },
                    { text: 'pico', hasLetter: false },
                    { text: 'polo', hasLetter: false },
                    { text: 'riel', hasLetter: false }
                ]
            },
            'S': {
                letter: 's',
                bg: 'bg-emerald-50',
                headerBg: 'bg-emerald-300',
                nextLetter: 'T',
                words: [
                    // 15 Correct words containing 's'
                    { text: 'sol', hasLetter: true },
                    { text: 'casa', hasLetter: true },
                    { text: 'mesa', hasLetter: true },
                    { text: 'oso', hasLetter: true },
                    { text: 'piso', hasLetter: true },
                    { text: 'sal', hasLetter: true },
                    { text: 'vaso', hasLetter: true },
                    { text: 'sopa', hasLetter: true },
                    { text: 'seis', hasLetter: true },
                    { text: 'saco', hasLetter: true },
                    { text: 'paso', hasLetter: true },
                    { text: 'sapo', hasLetter: true },
                    { text: 'suma', hasLetter: true },
                    { text: 'silla', hasLetter: true },
                    { text: 'susto', hasLetter: true },
                    // 9 Distractors without 's'
                    { text: 'pato', hasLetter: false },
                    { text: 'lata', hasLetter: false },
                    { text: 'gota', hasLetter: false },
                    { text: 'pala', hasLetter: false },
                    { text: 'taza', hasLetter: false },
                    { text: 'moto', hasLetter: false },
                    { text: 'luna', hasLetter: false },
                    { text: 'nube', hasLetter: false },
                    { text: 'aro', hasLetter: false }
                ]
            },
            'T': {
                letter: 't',
                bg: 'bg-sky-50',
                headerBg: 'bg-sky-300',
                nextLetter: 'P',
                words: [
                    // 15 Correct words containing 't'
                    { text: 'taza', hasLetter: true },
                    { text: 'pato', hasLetter: true },
                    { text: 'gota', hasLetter: true },
                    { text: 'lata', hasLetter: true },
                    { text: 'moto', hasLetter: true },
                    { text: 'topo', hasLetter: true },
                    { text: 'pata', hasLetter: true },
                    { text: 'tele', hasLetter: true },
                    { text: 'tiza', hasLetter: true },
                    { text: 'tapa', hasLetter: true },
                    { text: 'tela', hasLetter: true },
                    { text: 'torre', hasLetter: true },
                    { text: 'toro', hasLetter: true },
                    { text: 'tuna', hasLetter: true },
                    { text: 'tío', hasLetter: true },
                    // 9 Distractors without 't'
                    { text: 'casa', hasLetter: false },
                    { text: 'mesa', hasLetter: false },
                    { text: 'oso', hasLetter: false },
                    { text: 'sol', hasLetter: false },
                    { text: 'luna', hasLetter: false },
                    { text: 'vaso', hasLetter: false },
                    { text: 'nube', hasLetter: false },
                    { text: 'pala', hasLetter: false },
                    { text: 'aro', hasLetter: false }
                ]
            },
            'P': {
                letter: 'p',
                bg: 'bg-indigo-50',
                headerBg: 'bg-indigo-300',
                nextLetter: 'M',
                words: [
                    // 15 Correct words containing 'p'
                    { text: 'pato', hasLetter: true },
                    { text: 'pala', hasLetter: true },
                    { text: 'piso', hasLetter: true },
                    { text: 'puma', hasLetter: true },
                    { text: 'pesa', hasLetter: true },
                    { text: 'pote', hasLetter: true },
                    { text: 'pino', hasLetter: true },
                    { text: 'pomo', hasLetter: true },
                    { text: 'pila', hasLetter: true },
                    { text: 'pupa', hasLetter: true },
                    { text: 'papo', hasLetter: true },
                    { text: 'pipa', hasLetter: true },
                    { text: 'pira', hasLetter: true },
                    { text: 'poga', hasLetter: true },
                    { text: 'poya', hasLetter: true },
                    // 9 Distractors without 'p'
                    { text: 'casa', hasLetter: false },
                    { text: 'mesa', hasLetter: false },
                    { text: 'oso', hasLetter: false },
                    { text: 'sol', hasLetter: false },
                    { text: 'luna', hasLetter: false },
                    { text: 'vaso', hasLetter: false },
                    { text: 'nube', hasLetter: false },
                    { text: 'aro', hasLetter: false },
                    { text: 'taza', hasLetter: false }
                ]
            }
        };

        let currentActiveLetter = 'M';
        let foundCorrectCount = 0;
        let totalCorrectNeeded = 15;
        let isGameFinished = false;

        // Initialize game on load
        window.onload = function() {
            switchLetter('M');
        };

	function speakWord(word) {
            if ('speechSynthesis' in window) {
                // Cancela cualquier audio previo para que la lectura sea inmediata
                window.speechSynthesis.cancel(); 
                const utterance = new SpeechSynthesisUtterance(word);
                utterance.lang = 'es-MX'; // Español México
                utterance.rate = 0.85; // Velocidad un poco más lenta para mayor claridad
                utterance.pitch = 1.1; // Tono ligeramente más agudo y amigable
                window.speechSynthesis.speak(utterance);
            }
        }

        function switchLetter(letterKey) {
            currentActiveLetter = letterKey;
            foundCorrectCount = 0;
            isGameFinished = false;

            // Update button styles in navigation
            ['M', 'S', 'T', 'P'].forEach(l => {
                const btn = document.getElementById(`btn-${l}`);
                if (l === letterKey) {
                    const activeColorClass = letterKey === 'M' ? 'bg-amber-400 border-amber-600' : letterKey === 'S' ? 'bg-emerald-400 border-emerald-600' : letterKey === 'T' ? 'bg-sky-400 border-sky-600' : 'bg-indigo-400 border-indigo-600';
                    btn.className = `px-4 py-2 rounded-2xl font-bold text-lg shadow-md transition-all transform hover:scale-105 active:scale-95 text-white border-b-4 ${activeColorClass}`;
                } else {
                    btn.className = `px-4 py-2 rounded-2xl font-bold text-lg shadow-md transition-all transform hover:scale-105 active:scale-95 bg-stone-100 text-stone-600 border-b-4 border-stone-300`;
                }
            });

            // Update body background theme color
            const data = gameData[letterKey];
            document.getElementById('body-bg').className = `${data.bg} min-h-screen flex flex-col items-center justify-between p-4 transition-colors duration-500`;

            // Update instruction and letter target box
            document.getElementById('instruction-text').innerText = `¡RODEA LA PALABRA QUE CONTENGA LA LETRA ${letterKey}!`;
            document.getElementById('target-letter').innerText = data.letter;
            document.getElementById('target-letter-box').className = `w-24 h-24 md:w-28 md:h-28 rounded-full ${data.headerBg} border-4 border-red-500 flex items-center justify-center shadow-lg mx-auto`;

            updateProgressText();
            renderGrid();
            speakInstruction();
        }

        function renderGrid() {
            const gridContainer = document.getElementById('word-grid');
            gridContainer.innerHTML = '';
            
            // Shuffle words to keep it engaging every round
            const wordsList = [...gameData[currentActiveLetter].words].sort(() => Math.random() - 0.5);
            
            wordsList.forEach((item, index) => {
                const wordBtn = document.createElement('button');
                wordBtn.id = `word-item-${index}`;
                wordBtn.className = 'bg-white hover:bg-stone-50 border-2 border-stone-200 rounded-2xl py-3 px-2 text-xl md:text-2xl font-bold text-stone-800 shadow-sm transition-all transform active:scale-95 flex items-center justify-center';
                wordBtn.innerText = item.text;
                wordBtn.onclick = () => handleWordClick(index, item.hasLetter);
                gridContainer.appendChild(wordBtn);
            });
        }

	function handleWordClick(index, hasLetter) {
            if (isGameFinished) return;

            const btn = document.getElementById(`word-item-${index}`);

            // Prevent clicking already circled words
            if (btn.classList.contains('circled-word')) {
                return;
            }

            if (hasLetter) {
                // Correct choice!
                btn.classList.add('circled-word', 'bg-red-50', 'text-red-700', 'border-red-400');
                foundCorrectCount++;
                updateProgressText();
                playAudioTone(600, 150);
                showToast('¡Correcto! 🌟', 'bg-emerald-500');

                // NUEVO: Leer la palabra seleccionada en voz alta
                speakWord(btn.innerText);

                // Check if all 15 correct words are found
                if (foundCorrectCount >= totalCorrectNeeded) {
                    isGameFinished = true;
                    showToast(`🎉 ¡Excelente! Pasando a la letra ${gameData[currentActiveLetter].nextLetter}...`, 'bg-amber-500');
                    playVictorySound();
                    
                    setTimeout(() => {
                        switchLetter(gameData[currentActiveLetter].nextLetter);
                    }, 2200);
                }
            } else {
                // Incorrect choice! Rule: "si es incorrecta, reiniciar la actividad respecto a la letra que se está viendo."
                btn.classList.add('shake', 'bg-rose-200', 'border-rose-500', 'text-rose-900');
                playAudioTone(200, 300);
                showToast('❌ Incorrecto. ¡Reiniciando actividad!', 'bg-rose-500');

                setTimeout(() => {
                    resetCurrentGame();
                }, 1000);
            }
        }

        function resetCurrentGame() {
            foundCorrectCount = 0;
            isGameFinished = false;
            updateProgressText();
            renderGrid();
            showToast('🔄 Actividad reiniciada', 'bg-blue-500');
        }

        function updateProgressText() {
            document.getElementById('progress-status').innerText = `Encontradas: ${foundCorrectCount} / ${totalCorrectNeeded}`;
        }

        function showToast(message, bgColorClass) {
            const toast = document.getElementById('feedback-toast');
            toast.innerText = message;
            toast.className = `absolute bottom-4 px-6 py-3 rounded-2xl text-white font-bold text-lg shadow-2xl transition-all transform translate-y-0 ${bgColorClass}`;
            setTimeout(() => {
                toast.className = `hidden absolute bottom-4 px-6 py-3 rounded-2xl text-white font-bold text-lg shadow-2xl transition-all transform translate-y-10`;
            }, 2000);
        }

        function speakInstruction() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const textToSpeak = `Rodea la palabra que contenga la letra ${currentActiveLetter}`;
                const utterance = new SpeechSynthesisUtterance(textToSpeak);
                utterance.lang = 'es-MX'; // Latin Spanish voice
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            }
        }

        // Web Audio API for synthetic sound effects
        function playAudioTone(frequency, duration) {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.value = frequency;
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration / 1000);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + duration / 1000);
            } catch (e) {
                // AudioContext restricted fallback
            }
        }

        function playVictorySound() {
            setTimeout(() => playAudioTone(440, 150), 0);
            setTimeout(() => playAudioTone(554, 150), 150);
            setTimeout(() => playAudioTone(659, 150), 300);
            setTimeout(() => playAudioTone(880, 300), 450);
        }
    </script>
</body>
</html>
